name: Android debug APK

# 규칙 층 테스트(GUT)를 돌리고 디버그 APK를 만든다. APK는 저장소의 고정 디버그 키(keystore/debug.keystore)로
# 서명해서, 폰에 이미 깔린 앱 위에 지우지 않고 덮어 설치할 수 있다(docs/dev/build.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot and export templates
        run: |
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot && chmod +x godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir" && unzip -q templates.tpz && mv templates/* "$tdir/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Editor settings (Android SDK, Java)
        run: |
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT
          done

      - name: Import project
        run: godot --headless --import --quit || godot --headless --editor --quit

      - name: Unit tests (GUT)
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -ginclude_subdirs -gexit

      - name: Verify signing key (fixed debug keystore)
        run: |
          got=$(keytool -list -v -keystore keystore/debug.keystore -storepass android | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          want=$(cat keystore/debug.sha256)
          echo "keystore $got / expected $want"
          test "$got" = "$want"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/etymology-rpg-debug.apk
          ls -la build

      - name: Verify APK signature
        run: |
          apksigner=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs build/etymology-rpg-debug.apk | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          want=$(cat keystore/debug.sha256)
          echo "apk $got / expected $want"
          test "$got" = "$want"

      - uses: actions/upload-artifact@v4
        with:
          name: etymology-rpg-debug-apk
          path: build/etymology-rpg-debug.apk
