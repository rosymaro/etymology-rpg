<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" font-family="sans-serif" font-size="13">
  <rect width="760" height="432" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#222">전투 화면: 아군은 왼쪽 아래, 적 단어 카드는 오른쪽 위</text>
  <rect x="24" y="48" width="712" height="360" rx="12" fill="none" stroke="#999"/>
  <text x="204" y="68" font-size="11.5" fill="#666">적 단어 4개 (출전 순서 1→4)</text>
  <g fill="#e8f0fb" stroke="#3b6fb6" stroke-width="1.5">
    <rect x="204" y="76" width="120" height="100" rx="8"/><rect x="336" y="76" width="120" height="100" rx="8"/>
    <rect x="468" y="76" width="120" height="100" rx="8"/><rect x="600" y="76" width="120" height="100" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#222">
    <text x="264" y="104">export</text><text x="396" y="104">inspect</text><text x="528" y="104">describe</text><text x="660" y="104">attract</text>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="216" y="128">공격 5+C2</text><text x="216" y="146">방어 0</text><text x="216" y="164">체력 9−3C1</text>
    <text x="348" y="128">공격</text><text x="348" y="146">방어</text><text x="348" y="164">체력</text>
    <text x="480" y="128">공격</text><text x="480" y="146">방어</text><text x="480" y="164">체력</text>
    <text x="612" y="128">공격</text><text x="612" y="146">방어</text><text x="612" y="164">체력</text>
  </g>
  <text x="720" y="200" text-anchor="end" font-size="11.5" fill="#666">카드를 누르면 어원과 뜻이 나온다</text>
  <circle cx="88" cy="330" r="30" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="88" y="334" text-anchor="middle" font-size="11.5" fill="#222">주인공</text>
  <g fill="#fdeee0" stroke="#d2782a" stroke-width="1.5">
    <circle cx="164" cy="330" r="24"/><circle cx="228" cy="330" r="24"/><circle cx="292" cy="330" r="24"/><circle cx="356" cy="330" r="24"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#222">
    <text x="164" y="334">1</text><text x="228" y="334">2</text><text x="292" y="334">3</text><text x="356" y="334">4</text>
  </g>
  <text x="164" y="378" font-size="11.5" fill="#666">내 유닛 4개 (출전 순서 1→4)</text>
</svg>
